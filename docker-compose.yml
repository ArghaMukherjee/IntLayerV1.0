name: integration-layer

x-il-build: &il-build
  build: { context: ., dockerfile: integration_layer/Dockerfile }
  image: integration-layer:latest

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: integration
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d integration"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot: applies db/*.sql and creates the service login users
  migrate:
    <<: *il-build
    command: ["python", "-m", "integration_layer.migrate"]
    environment:
      MIGRATE_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/integration
      MIGRATE_IL_API_PASSWORD: ${IL_API_DB_PASSWORD:?set in .env}
      MIGRATE_APP2_PASSWORD: ${APP2_DB_PASSWORD:?set in .env}
      MIGRATE_SCHEDULER_PASSWORD: ${SCHEDULER_DB_PASSWORD:?set in .env}
      MIGRATE_BI_READER_PASSWORD: ${BI_READER_DB_PASSWORD:?set in .env}
      MIGRATE_UI_READER_PASSWORD: ${UI_READER_DB_PASSWORD:?set in .env}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  il-api:
    <<: *il-build
    environment:
      IL_DATABASE_URL: postgresql://il_api:${IL_API_DB_PASSWORD}@postgres:5432/integration
      IL_API_KEYS: app1:${APP1_API_KEY:?set in .env}
      IL_ADMIN_API_KEY: ${ADMIN_API_KEY:?set in .env}
      IL_CALLBACK_SIGNING_SECRET: ${CALLBACK_SIGNING_SECRET}
      IL_CALLBACK_ALLOWED_HOSTS: ${CALLBACK_ALLOWED_HOSTS}
    ports:
      - "8000:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  il-scheduler:
    <<: *il-build
    command: ["python", "-m", "integration_layer.scheduler"]
    environment:
      SCHEDULER_DATABASE_URL: postgresql://il_scheduler_user:${SCHEDULER_DB_PASSWORD}@postgres:5432/integration
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  app2:
    build: { context: ., dockerfile: app2/Dockerfile }
    image: integration-app2:latest
    environment:
      APP2_DATABASE_URL: postgresql://app2:${APP2_DB_PASSWORD}@postgres:5432/integration
      APP2_MAX_CONCURRENCY: "5"
    ports:
      - "8001:8001"     # remove this mapping to run several replicas (--scale app2=3)
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5
    stop_grace_period: 2m   # lets in-flight requests finish
    restart: unless-stopped

  # Stand-in for App1; replace with the real application
  app1-mock:
    build: { context: ., dockerfile: app1_mock/Dockerfile }
    image: integration-app1-mock:latest
    environment:
      APP1_IL_BASE_URL: http://il-api:8000
      APP1_IL_API_KEY: ${APP1_API_KEY}
      APP1_CALLBACK_URL: http://app1-mock:8002/hooks/il
      APP1_CALLBACK_SIGNING_SECRET: ${CALLBACK_SIGNING_SECRET}
    ports:
      - "8002:8002"
    depends_on:
      il-api: { condition: service_healthy }
    restart: unless-stopped

  # Operations console (dashboard, request explorer, test sender)
  ui:
    build: { context: ., dockerfile: ui/Dockerfile }
    image: integration-ui:latest
    environment:
      UI_DATABASE_URL: postgresql://ui_reader:${UI_READER_DB_PASSWORD}@postgres:5432/integration
      UI_IL_BASE_URL: http://il-api:8000
      UI_IL_API_KEY: ${APP1_API_KEY}
      UI_ADMIN_API_KEY: ${ADMIN_API_KEY}
      UI_APP2_URL: http://app2:8001
      UI_APP1_URL: http://app1-mock:8002
      UI_CALLBACK_URL: http://app1-mock:8002/hooks/il
    ports:
      - "127.0.0.1:8080:8080"   # localhost only: the console holds the admin key
    depends_on:
      il-api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
